name: PR safety

# Checks aimed at malicious or careless changes, on every PR to master.
#
# pull_request_target runs this file as it is on the BASE branch, so a PR
# cannot edit or disable these checks. That trigger is only safe because no
# step here executes code from the PR: the token is read-only, no secrets are
# used, the PR's files are read as git objects (never checked out or run),
# and the scanner is the base branch's copy. Keep it that way: never add a
# step that runs `npm ci`, a script, or a build from the PR's head.
on:
  pull_request_target:
    branches: [master, main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      # Fails on new dependencies with known vulnerabilities (moderate or worse).
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  hidden-unicode:
    runs-on: ubuntu-latest
    steps:
      # The base branch, with its scanner. No credentials are left in .git.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the PR's changed files for hidden Unicode
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          node scripts/check-hidden-unicode.mjs --diff "$BASE_SHA" refs/remotes/pr/head
